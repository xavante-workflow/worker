
services:
  xavante-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: xavante/worker:latest
    container_name: xavante-worker
    restart: unless-stopped
    
    # Environment variables
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-Xavante Worker}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    
    # Volume mounts for development
    volumes:
      # Mount source code for development (comment out for production)
      - ./src:/app 
      # Mount storage for logs and cache
      - worker_storage:/app/storage
      - ../lib/core:/app/lib/core
    
    # Network configuration
    networks:
      - xavante-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "php", "/app/worker", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Development service with hot reload
  xavante-worker-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: xavante/worker:dev
    container_name: xavante-worker-dev
    
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    
    volumes:
      # Mount source code for development
      - ./app:/app:cached
      # Mount composer cache for faster builds
      - composer_cache:/tmp/composer_cache
    
    networks:
      - xavante-network
    
    # Override command for development
    command: ["php", "/app/worker", "worker:run", "--verbose"]
    
    profiles:
      - development

# Named volumes
volumes:
  worker_storage:
    driver: local
  composer_cache:
    driver: local

# Networks
networks:
  xavante-network:
    driver: bridge
    name: xavante-network